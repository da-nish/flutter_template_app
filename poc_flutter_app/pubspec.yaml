name: poc_flutter_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  intl: ^0.20.0

  cupertino_icons: ^1.0.8
  dio: ^5.3.2
  get_it: ^8.0.2
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^17.0.0
  ps_ui:
    path: ../packages/ps_ui
  ps_api:
    path: ../packages/ps_api
  ps_db:
    path: ../packages/ps_db
  ps_whatsnext:
    path: ../packages/ps_whatsnext
  internet_connection_checker_plus: ^3.0.0
  flutter_dotenv: ^6.0.1
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  # riverpod_generator: ^4.0.0+1
  # build_runner: ^2.4.13
  # flutter_gen_runner:


  # build_runner: ^2.4.13
  # flutter_gen_runner: ^5.14.0

  riverpod_generator: ^4.0.0+1
  build_runner: ^2.4.13
  flutter_gen_runner: 5.12.0
  built_value: 8.12.3
  package_config: 2.2.0
  json_annotation:
  checked_yaml:


flutter:
  uses-material-design: true
  generate: true
  assets:
    #========Environments[IMPORTANT]=============#
    - lib/env/.env.development
    - lib/env/.env.production
    - lib/env/.env.staging

arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart